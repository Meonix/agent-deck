    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="#5b5bd6"/>                 <!-- iris-9 -->
    <rect x="360" y="230" width="480" height="420" rx="80" fill="#b1a9ff"/>         <!-- iris-dark-11 -->
    <rect x="184" y="370" width="560" height="470" rx="90" fill="#111113"/>         <!-- slate-dark-1 -->
    <polyline points="280,500 400,605 280,710" fill="none" stroke="#edeef0" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="450" y="664" width="190" height="64" rx="18" fill="#ffc53d"/>          <!-- amber-9 -->
  </g>
</svg>
